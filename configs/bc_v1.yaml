dataset_name: immanuelpeter/carla-autopilot-multimodal-dataset
sequence_length: 4
target_image_size: [224, 224]
backbone: resnet18
pretrained: true
freeze_early_layers: true
transformer_heads: 4
transformer_layers: 2
dropout: 0.1
learning_rate: 0.0001
weight_decay: 0.0001
batch_size: 32
num_epochs: 30
steering_loss_weight: 2.0
throttle_loss_weight: 1.0
recovery_proxy_weight: 2.0
recovery_steering_threshold: 0.15
augmentation_shift_pixels: 30
augmentation_steering_gain: 0.002
seed: 42
output_dir: outputs/phase3
