name: "✨ Feature Request"
description: "Suggest a feature, enhancement, or metric improvement"
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please verify that new feature ideas align with the project narrative and Constitution before filing.
  - type: textarea
    id: problem
    attributes:
      label: Problem or Motivation
      description: What limitation or motivation does this feature address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe the implementation approach.
    validations:
      required: true
  - type: textarea
    id: constitutional_fit
    attributes:
      label: Core Narrative & Constitutional Alignment
      description: How does this feature fit or enhance the core causal chain without causing scope creep?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any other approaches considered?
    validations:
      required: false
