[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "carla-autopilot-multimodal"
version = "0.1.0"
description = "CARLA-based autonomous driving perception project"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "datasets>=2.19",
  "requests>=2.31",
  "torch>=2.4",
  "torchvision>=0.19",
]

[project.optional-dependencies]
dev = [
  "black>=24.0",
  "isort>=5.13",
  "mypy>=1.8",
  "pytest>=8.0",
  "hypothesis>=6.100",
  "types-requests>=2.31",
  "wandb>=0.17",
]
viz = [
  "matplotlib>=3.8",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100
src_paths = ["src", "tests"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
